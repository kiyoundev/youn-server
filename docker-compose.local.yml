# Local dev overrides for docker-compose.yml — not shipped to the Pi.
# Provides a temporary local Postgres for dev when the Synology NAS isn't
# reachable (e.g. off the home LAN, before Tailscale is set up), and remaps
# backend's TradingAgents mount to a Docker-Desktop-default-shared path.
#
# Usage:
#   docker compose -f docker-compose.local.yml up -d
#
# Point DATABASE_URL at it (see .env.example):
#   postgresql+asyncpg://youn:change_me@localhost:5433/youn_server
#
# Then run migrations from backend/:
#   uv run alembic upgrade head
#
# This is standalone on purpose — it does NOT extend docker-compose.yml, so
# it never accidentally ships to the NAS/RPi deploy. If you also want the
# backend/frontend running in Docker locally, add this file alongside the
# main one instead of merging them:
#   docker compose -f docker-compose.yml -f docker-compose.local.yml up -d
# (the db becomes reachable from other services as host "db", port 5432)
services:
  # Remaps backend's /opt/tradingagents mount to a path under /Users, which
  # Docker Desktop shares with containers by default — /opt itself isn't,
  # so the base compose file's mount fails on Mac with "mounts denied"
  # unless /opt is manually added under Settings -> Resources -> File
  # Sharing. Compose merges `volumes` by matching the container-side target
  # path, so this entry replaces docker-compose.yml's for local runs only;
  # the Pi's deploy (docker-compose.yml alone, no override) is unaffected.
  backend:
    volumes:
      - /Users/youn/Documents/tools/TradingAgents:/opt/tradingagents

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: youn
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
      POSTGRES_DB: youn_server
    ports:
      # host 5433 to match the port the Synology Postgres package uses,
      # so DATABASE_URL only needs its host swapped when you switch back
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U youn -d youn_server"]
      interval: 5s
      timeout: 5s
      retries: 5
    # Standalone usage (just this file) has no other service to share a
    # network with, so `db` was left off `app` and fell onto Compose's
    # implicit default network instead. That silently broke the layered
    # usage below this file's own comment claims works — backend/frontend
    # (docker-compose.yml) are explicitly on `app`, so `db` needs to be too
    # or `backend` can't resolve the hostname `db` at all (confirmed live:
    # asyncpg raised `socket.gaierror: Name or service not known`).
    networks:
      - app

networks:
  app:
    # Declares (doesn't redefine) the network docker-compose.yml already
    # creates, so Compose attaches to the same one instead of erroring on
    # an undeclared network name when this file's `db` service references
    # it under the layered-usage case.
    external: false

volumes:
  pgdata:
