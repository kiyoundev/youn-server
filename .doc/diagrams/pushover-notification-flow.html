<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pushover Notification Delivery</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · youn-server</p>
    <h1>Pushover Notification Delivery</h1>

    <svg viewBox="0 0 840 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="pushover-flow-title pushover-flow-desc">
      <title id="pushover-flow-title">Pushover notification delivery flow</title>
      <desc id="pushover-flow-desc">The backend publishes one push to Pushover's servers, which relay it through Apple's push service to every Apple device signed into the account, with the Watch receiving it as an iPhone companion push.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-muted-dash" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#7a8399"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- ============ ZONE: Apple devices ============ -->
      <rect x="596" y="56" width="176" height="352" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <rect x="612" y="60" width="144" height="12" rx="2" fill="#f5f5f5"/>
      <text x="684" y="69" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">YOUR APPLE DEVICES</text>

      <!-- ============ ARROWS (drawn before boxes) ============ -->

      <!-- Backend -> Pushover -->
      <line x1="180" y1="232" x2="228" y2="232" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="186" y="212" width="88" height="12" rx="2" fill="#f5f5f5"/>
      <text x="230" y="221" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">POST /messages</text>

      <!-- Pushover -> APNs -->
      <line x1="368" y1="232" x2="416" y2="232" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="368" y="212" width="48" height="12" rx="2" fill="#f5f5f5"/>
      <text x="392" y="221" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">RELAY</text>

      <!-- APNs -> iPhone (fan-out, attach y=216, mid=580) -->
      <path d="M 556,216 H 572 Q 580,216 580,208 V 124 Q 580,116 588,116 H 612"
            fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- APNs -> iPad (fan-out, attach y=232, mid=584) -->
      <path d="M 556,232 H 576 Q 584,232 584,240 V 260 Q 584,268 592,268 H 612"
            fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- APNs -> Mac (fan-out, attach y=248, mid=588) -->
      <path d="M 556,248 H 580 Q 588,248 588,256 V 340 Q 588,348 596,348 H 612"
            fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- iPhone -> Watch (companion relay, dashed) -->
      <line x1="684" y1="144" x2="684" y2="160" stroke="#7a8399" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow-muted-dash)"/>

      <!-- ============ NODES ============ -->

      <!-- Backend (youn-server) -->
      <rect x="40" y="200" width="140" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="40" y="200" width="140" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <g transform="translate(100,208) scale(0.85)" stroke="#2d3142">
        <path d="M3 7a3 3 0 0 1 3 -3h12a3 3 0 0 1 3 3v2a3 3 0 0 1 -3 3h-12a3 3 0 0 1 -3 -3" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M3 15a3 3 0 0 1 3 -3h12a3 3 0 0 1 3 3v2a3 3 0 0 1 -3 3h-12a3 3 0 0 1 -3 -3l0 -2" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M7 8l0 .01" stroke-width="1.5" stroke-linecap="round"/>
        <path d="M7 16l0 .01" stroke-width="1.5" stroke-linecap="round"/>
      </g>
      <text x="110" y="240" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">youn-server</text>
      <text x="110" y="254" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">send_pushover()</text>

      <!-- Pushover (FOCAL — the broker) -->
      <rect x="228" y="200" width="140" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="228" y="200" width="140" height="64" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
      <g transform="translate(288,208) scale(0.85)" stroke="#eb6c36">
        <path d="M6.657 18c-2.572 0 -4.657 -2.007 -4.657 -4.483c0 -2.475 2.085 -4.482 4.657 -4.482c.393 -1.762 1.794 -3.2 3.675 -3.773c1.88 -.572 3.956 -.193 5.444 1c1.488 1.19 2.162 3.007 1.77 4.769h.99c1.913 0 3.464 1.56 3.464 3.486c0 1.927 -1.551 3.487 -3.465 3.487h-11.878" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
      <text x="298" y="240" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Pushover</text>
      <text x="298" y="254" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">api.pushover.net</text>

      <!-- APNs -->
      <rect x="416" y="200" width="140" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="416" y="200" width="140" height="64" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <g transform="translate(476,208) scale(0.85)" stroke="#2d3142">
        <path d="M13 12v.01" stroke-width="1.5" stroke-linecap="round"/>
        <path d="M3 21h18" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M5 21v-16a2 2 0 0 1 2 -2h6m4 10.5v7.5" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M21 7h-7m3 -3l-3 3l3 3" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
      <text x="486" y="240" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Apple APNs</text>
      <text x="486" y="254" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">push gateway</text>

      <!-- iPhone -->
      <rect x="612" y="88" width="144" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="612" y="88" width="144" height="56" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <g transform="translate(674,94) scale(0.7)" stroke="#2d3142">
        <path d="M6 5a2 2 0 0 1 2 -2h8a2 2 0 0 1 2 2v14a2 2 0 0 1 -2 2h-8a2 2 0 0 1 -2 -2v-14" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M11 4h2" stroke-width="1.5" stroke-linecap="round"/>
        <path d="M12 17v.01" stroke-width="1.5" stroke-linecap="round"/>
      </g>
      <text x="684" y="124" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">iPhone</text>
      <text x="684" y="136" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Pushover app</text>

      <!-- Apple Watch (companion — same footprint as other devices) -->
      <rect x="612" y="160" width="144" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="612" y="160" width="144" height="56" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <g transform="translate(674,166) scale(0.7)" stroke="#2d3142">
        <path d="M6 5a2 2 0 0 1 2 -2h8a2 2 0 0 1 2 2v14a2 2 0 0 1 -2 2h-8a2 2 0 0 1 -2 -2v-14" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        <rect x="8" y="-2" width="8" height="4" rx="1" fill="none" stroke-width="1.5"/>
        <rect x="8" y="22" width="8" height="4" rx="1" fill="none" stroke-width="1.5"/>
      </g>
      <text x="684" y="196" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Apple Watch</text>
      <text x="684" y="208" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">companion, via iPhone</text>

      <!-- iPad -->
      <rect x="612" y="240" width="144" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="612" y="240" width="144" height="56" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <g transform="translate(674,246) scale(0.7)" stroke="#2d3142">
        <path d="M6 5a2 2 0 0 1 2 -2h8a2 2 0 0 1 2 2v14a2 2 0 0 1 -2 2h-8a2 2 0 0 1 -2 -2v-14" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M11 4h2" stroke-width="1.5" stroke-linecap="round"/>
        <path d="M12 17v.01" stroke-width="1.5" stroke-linecap="round"/>
      </g>
      <text x="684" y="276" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">iPad</text>
      <text x="684" y="288" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Pushover app</text>

      <!-- Mac -->
      <rect x="612" y="320" width="144" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="612" y="320" width="144" height="56" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <g transform="translate(674,326) scale(0.7)" stroke="#2d3142">
        <path d="M3 5a1 1 0 0 1 1 -1h16a1 1 0 0 1 1 1v10a1 1 0 0 1 -1 1h-16a1 1 0 0 1 -1 -1v-10" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M7 20h10" stroke-width="1.5" stroke-linecap="round"/>
        <path d="M9 16v4" stroke-width="1.5" stroke-linecap="round"/>
        <path d="M15 16v4" stroke-width="1.5" stroke-linecap="round"/>
      </g>
      <text x="684" y="356" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Mac</text>
      <text x="684" y="368" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Pushover app</text>

      <!-- Editorial callout -->
      <text x="298" y="284" fill="#4f5d75" font-size="14" font-style="italic" font-family="'Instrument Serif', serif" text-anchor="middle">One hop, no relay to self-host</text>

      <!-- ============ LEGEND ============ -->
      <line x1="40" y1="428" x2="800" y2="428" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="40" y="448" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>

      <rect x="160" y="440" width="12" height="12" rx="3" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
      <text x="180" y="449" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">BROKER (FAN-OUT HUB)</text>

      <rect x="380" y="440" width="12" height="12" rx="3" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="400" y="449" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">EXTERNAL / DEVICE</text>

      <line x1="600" y1="446" x2="628" y2="446" stroke="#7a8399" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="636" y="449" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">COMPANION RELAY</text>

    </svg>
  </div>
</body>
</html>
