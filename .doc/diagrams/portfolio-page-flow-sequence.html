  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {

      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;

      font-size: 0.66rem;

      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 900px; display: block; }

    <h1>Portfolio page — two requests, two caches, one rarely-touched table</h1>

<title id="portfolio-page-flow-title">Portfolio page request flow</title>
<desc id="portfolio-page-flow-desc">Sequence diagram of the /portfolio page loading. The page asks the API routes for positions; the routes ask the ledger cache for holdings, which reads the activities table only when empty, then ask PriceService for quotes and AssetTypeService for each holding's type, together, and return the rows. The page then asks for the summary; the routes reuse the cached ledger and quotes, read the USD rate from fx_rates and return the totals and balance.</desc>
