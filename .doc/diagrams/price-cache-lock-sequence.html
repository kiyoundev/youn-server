<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Price Cache Lock Sequence</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1100px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Sequence · Diagram Design</p>
    <h1>Price cache + lock — two routes, one fetch</h1>

    <svg viewBox="0 0 880 848" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="price-cache-lock-sequence-title price-cache-lock-sequence-desc">
      <title id="price-cache-lock-sequence-title">Price cache and lock — two routes share one fetch</title>
      <desc id="price-cache-lock-sequence-desc">Sequence diagram showing the positions and summary routes asking PriceService for the same quote at once: the first takes a per-key lock and fetches from the source, writes a 15-second cache note and releases, and the second then re-checks the cache, finds the fresh note and returns without fetching; an alt fragment shows that a failed fetch, including one that hangs past the 5-second timeout, returns the old quote marked stale, or unavailable when none exists.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- ============ LIFELINES ============ -->
      <line x1="160" y1="88" x2="160" y2="416" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="340" y1="88" x2="340" y2="700" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="560" y1="88" x2="560" y2="700" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="760" y1="88" x2="760" y2="520" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>

      <!-- ============ STEP DIVIDER ============ -->
      <line x1="32" y1="440" x2="848" y2="440" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="32" y="456" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">IF THE FETCH FAILS OR HANGS PAST 5S · REPLACES THE RETURN ABOVE</text>

      <!-- ============ ALT FRAGMENT ============ -->
      <rect x="316" y="520" width="272" height="164" rx="4" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
      <rect x="316" y="520" width="40" height="16" rx="2" fill="#f5f5f5" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
      <text x="336" y="532" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">ALT</text>
      <text x="364" y="552" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.04em">[old note exists]</text>
      <line x1="324" y1="612" x2="580" y2="612" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="364" y="632" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.04em">[no old note]</text>

      <!-- ============ ACTIVATION BARS ============ -->
      <rect x="156" y="136" width="8" height="232" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
      <rect x="556" y="136" width="8" height="272" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
      <rect x="556" y="488" width="8" height="184" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
      <rect x="756" y="256" width="8" height="32" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
      <rect x="756" y="480" width="8" height="32" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>

      <!-- ============ MESSAGES ============ -->
      <!-- 1: /positions -> PriceService -->
      <path d="M164,136 H556" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="418" y="116" width="60" height="12" rx="2" fill="#f5f5f5"/>
      <text x="448" y="125" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">GET PRICE</text>

      <!-- 2: /summary -> PriceService, same instant -->
      <path d="M340,168 H556" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="418" y="148" width="60" height="12" rx="2" fill="#f5f5f5"/>
      <text x="448" y="157" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">GET PRICE</text>

      <!-- 3: lock for /positions -->
      <path d="M564,196 H580 Q588,196 588,204 V212 Q588,220 580,220 H566" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="596" y="204" width="104" height="12" rx="2" fill="#f5f5f5"/>
      <text x="602" y="213" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">LOCK · /POSITIONS</text>

      <!-- 4: fetch -->
      <path d="M564,256 H756" fill="none" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <rect x="638" y="236" width="44" height="12" rx="2" fill="#f5f5f5"/>
      <text x="660" y="245" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">FETCH</text>

      <!-- 5: price returns -->
      <path d="M756,288 H564" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <rect x="618" y="268" width="84" height="12" rx="2" fill="#f5f5f5"/>
      <text x="660" y="277" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">PRICE · 335.38</text>

      <!-- 6: write note, unlock -->
      <path d="M564,312 H580 Q588,312 588,320 V328 Q588,336 580,336 H566" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="596" y="316" width="116" height="12" rx="2" fill="#f5f5f5"/>
      <text x="602" y="325" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">WRITE NOTE · UNLOCK</text>

      <!-- 7: return to /positions -->
      <path d="M556,368 H164" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <rect x="214" y="348" width="76" height="12" rx="2" fill="#f5f5f5"/>
      <text x="252" y="357" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">OK · 335.38</text>

      <!-- 8: headline - /summary re-checks, cache hit -->
      <path d="M556,400 H340" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <rect x="406" y="380" width="84" height="12" rx="2" fill="#f5f5f5"/>
      <text x="448" y="389" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">RE-CHECK · HIT</text>

      <!-- 9: source fails (failure scenario) -->
      <path d="M756,496 H564" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <rect x="608" y="476" width="104" height="12" rx="2" fill="#f5f5f5"/>
      <text x="660" y="485" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">FAILS / 5S TIMEOUT</text>

      <!-- 10: alt region 1 -->
      <path d="M556,584 H340" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <rect x="408" y="564" width="84" height="12" rx="2" fill="#f5f5f5"/>
      <text x="450" y="573" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">STALE · 335.38</text>

      <!-- 11: alt region 2 -->
      <path d="M556,664 H340" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <rect x="418" y="644" width="64" height="12" rx="2" fill="#f5f5f5"/>
      <text x="450" y="653" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">UNAVAILABLE</text>

      <!-- ============ NODES ============ -->
      <rect x="90" y="32" width="140" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="90" y="32" width="140" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="98" y="38" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="112" y="47" fill="rgba(45,49,66,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">API</text>
      <text x="160" y="66" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">/positions</text>
      <text x="160" y="80" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">GET /api/positions</text>
      <rect x="270" y="32" width="140" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="270" y="32" width="140" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="278" y="38" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="292" y="47" fill="rgba(45,49,66,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">API</text>
      <text x="340" y="66" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">/summary</text>
      <text x="340" y="80" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">GET /portfolio/summary</text>
      <rect x="490" y="32" width="140" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="490" y="32" width="140" height="56" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <rect x="498" y="38" width="28" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.50)" stroke-width="0.8"/>
      <text x="512" y="47" fill="rgba(235,108,54,0.9)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SVC</text>
      <text x="560" y="66" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">PriceService</text>
      <text x="560" y="80" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">cache + lock per key</text>
      <rect x="690" y="32" width="140" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="690" y="32" width="140" height="56" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <rect x="698" y="38" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="712" y="47" fill="rgba(45,49,66,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">EXT</text>
      <text x="760" y="66" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Source</text>
      <text x="760" y="80" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Finnhub / yfinance</text>

      <!-- waiting note -->
      <rect x="352" y="196" width="104" height="18" rx="2" fill="#f5f5f5"/>
      <rect x="352" y="196" width="104" height="18" rx="2" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="404" y="208" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">WAITS ON LOCK</text>

      <!-- ============ CALLOUTS (editorial) ============ -->
      <text x="48" y="728" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">THE SECOND CHECK</text>
      <text x="48" y="744" fill="#4f5d75" font-size="12" font-style="italic" font-family="'Instrument Serif', serif">After the lock, /summary looks again.</text>
      <text x="48" y="760" fill="#4f5d75" font-size="12" font-style="italic" font-family="'Instrument Serif', serif">Note under 15s old: no second fetch.</text>
      <text x="400" y="728" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">30S LATER</text>
      <text x="400" y="744" fill="#4f5d75" font-size="12" font-style="italic" font-family="'Instrument Serif', serif">Next poll: the note is over 15s old,</text>
      <text x="400" y="760" fill="#4f5d75" font-size="12" font-style="italic" font-family="'Instrument Serif', serif">so one new fetch, same sequence.</text>
      <text x="640" y="728" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">IF THE SOURCE HANGS</text>
      <text x="640" y="744" fill="#4f5d75" font-size="12" font-style="italic" font-family="'Instrument Serif', serif">Gives up after 5s: a failed fetch,</text>
      <text x="640" y="760" fill="#4f5d75" font-size="12" font-style="italic" font-family="'Instrument Serif', serif">lock freed, stale price served.</text>

      <!-- ============ LEGEND ============ -->
      <line x1="32" y1="784" x2="848" y2="784" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="32" y="800" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>

      <rect x="32" y="812" width="12" height="12" rx="3" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
      <text x="52" y="821" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">PRICE SERVICE</text>

      <rect x="168" y="812" width="12" height="12" rx="3" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="188" y="821" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">ROUTE</text>

      <rect x="256" y="812" width="12" height="12" rx="3" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="276" y="821" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">EXTERNAL SOURCE</text>

      <line x1="396" y1="818" x2="420" y2="818" stroke="#2e5aa8" stroke-width="1.2"/>
      <text x="428" y="821" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">UPSTREAM CALL</text>

      <line x1="528" y1="818" x2="552" y2="818" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4"/>
      <text x="560" y="821" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">RETURN</text>

      <line x1="632" y1="818" x2="656" y2="818" stroke="#eb6c36" stroke-width="1.2"/>
      <text x="664" y="821" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">CACHE HIT (HEADLINE)</text>
    </svg>
  </div>
</body>
</html>
