services:
  backend:
    build: ./backend
    platform: linux/arm64
    restart: unless-stopped
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - /opt/tradingagents:/opt/tradingagents

  frontend:
    build: ./frontend
    platform: linux/arm64
    restart: unless-stopped
    env_file: .env
    ports:
      - "3000:3000"
    depends_on:
      - backend
