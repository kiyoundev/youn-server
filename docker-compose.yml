services:
  backend:
    build: ./backend
    platform: linux/arm64
    restart: unless-stopped
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - /opt/tradingagents:/opt/tradingagents
      # OAuth profile from `ant auth login` (host-side, run separately on
      # each machine — see #25). ${HOME} resolves per-host at `docker
      # compose up` time (/home/youn on Pi, /Users/youn on Mac), so this
      # one line covers both without a docker-compose.local.yml override.
      - ${HOME}/.config/anthropic:/home/pwuser/.config/anthropic
    networks:
      - app

  frontend:
    build: ./frontend
    platform: linux/arm64
    restart: unless-stopped
    env_file: .env
    environment:
      - BACKEND_URL=http://backend:8000
    ports:
      # Bound to localhost only — `tailscale serve` (443, HTTPS) proxies to
      # this from the Pi's own host process, but nothing on LAN/Tailscale
      # can reach plain-HTTP :3000 directly anymore. Closes the insecure
      # path that crashed the watchlist page (Web Locks API needs a secure
      # context) instead of relying solely on sse-leader.ts's fallback guard.
      - "127.0.0.1:3000:3000"
    depends_on:
      - backend
    networks:
      - app

  # Network-wide DNS ad/tracker blocking (#34). On its own compose
  # network — no L2/L3 reachability to backend/frontend, even if
  # compromised. Shares only this host and compose file.
  pihole:
    image: pihole/pihole:2026.05.0
    restart: unless-stopped
    environment:
      TZ: America/Los_Angeles
      FTLCONF_webserver_api_password: ${PIHOLE_WEBPASSWORD}
      # Default bridge networking (no --net=host), so DNS must listen on
      # all interfaces, not just the one Docker sees as "local":
      FTLCONF_dns_listeningMode: all
    ports:
      - "53:53/tcp"
      - "53:53/udp"
      # 8081 avoids colliding with frontend (3000) / backend (8000)
      - "8081:80"
    volumes:
      - pihole_etc:/etc/pihole
    # Not using Pi-hole as a DHCP server (Eero handles DHCP), so the
    # NET_ADMIN capability it's commonly paired with isn't needed here.
    networks:
      - pihole

networks:
  app:
  pihole:

volumes:
  pihole_etc:
