<!-- Trimmed from real amazon.ca markup (B0FQFPN3WR, new $54.98 + used $52.13, accordion layout), 2026-10-12.
     Kept on purpose: the ids duplicated across both rows (corePrice_feature_div, addToCart_feature_div,
     form#addToCart), the used row's own hidden prices, the used row's twister input holding the NEW price,
     and the title price block whose apex nodes are empty with the text in the label spans. -->
<div id="corePriceDisplay_desktop_feature_div">
  <div id="apex_desktop_newAccordionRow"><div>
    <span class="a-price apex-pricetopay-value" data-a-size="xl"><span class="a-offscreen"></span></span>
    <span id="apex-pricetopay-accessibility-label" data-pricetopay-label="{priceToPay}" data-pricetopay-savings-label="{priceToPay} with {savings} percent savings" class="aok-offscreen">$54.98</span>
  </div></div>
  <div id="apex_desktop_usedAccordionRow"><div>
    <span class="a-price apex-pricetopay-value" data-a-size="xl"><span class="a-offscreen"></span></span>
    <span id="apex-pricetopay-accessibility-label" data-pricetopay-label="{priceToPay}" data-pricetopay-savings-label="{priceToPay} with {savings} percent savings" class="aok-offscreen">$52.13 with 5 percent savings</span>
  </div></div>
</div>
<div id="desktop_accordion"><div id="accordionRows_feature_div"><div id="accordionRows"><div id="buyBoxAccordion" class="a-accordion">

  <div id="newAccordionRow_0" class="a-box a-accordion-active"><div class="a-box-inner a-accordion-row-container">
    <div class="a-accordion-row accordion-header"><h5>
      <div id="newAccordionCaption_feature_div"><span class="a-text-bold"> Buy New </span></div>
      <div id="apex_offerDisplay_desktop"><div id="corePrice_feature_div"><div class="a-row"><div class="a-spacing-top-mini apex-core-price-identifier">
        <span class="a-price a-text-normal apex-pricetopay-value" data-a-size="l"><span class="a-offscreen">$54.98</span><span aria-hidden="true"><span class="a-price-whole">54<span class="a-price-decimal">.</span></span><span class="a-price-fraction">98</span></span></span>
      </div></div></div></div>
    </h5></div>
    <div class="a-accordion-inner accordion-row-content"><div class="a-section">
      <form id="addToCart" method="post" action="/gp/product/handle-buy-box/ref=dp_start-bbf_1_glance">
        <input type="hidden" name="items[0.base][customerVisiblePrice][amount]" value="54.98">
        <input type="hidden" name="items[0.base][customerVisiblePrice][currencyCode]" value="CAD">
        <div id="desktop_qualifiedBuyBox">
          <div id="availability"><span class="primary-availability-message"> In Stock </span></div>
          <div id="twisterPlusPriceSubtotalWWDesktop_feature_div"><input type="hidden" id="twister-plus-price-data-price" value="54.98"></div>
          <div id="addToCart_feature_div"><div class="a-button-stack"><span id="atc-declarative"><span class="a-button a-button-primary"><span class="a-button-inner"><input id="add-to-cart-button" name="submit.add-to-cart" class="a-button-input" type="submit" value="Add to cart"></span></span></span></div></div>
        </div>
      </form>
    </div></div>
  </div></div>

  <div id="usedAccordionRow" class="a-box"><div class="a-box-inner a-accordion-row-container">
    <div class="a-accordion-row accordion-header"><h5>
      <div id="usedAccordionCaption_feature_div"><span class="a-text-bold"> Used – Like New </span></div>
      <div id="apex_offerDisplay_desktop"><div id="corePrice_feature_div"><div class="a-row"><div class="a-spacing-top-mini apex-core-price-identifier">
        <span class="a-price a-text-normal apex-pricetopay-value" data-a-size="l"><span class="a-offscreen">$52.13</span><span aria-hidden="true"><span class="a-price-whole">52<span class="a-price-decimal">.</span></span><span class="a-price-fraction">13</span></span></span>
      </div></div></div></div>
    </h5></div>
    <div class="a-accordion-inner accordion-row-content"><div class="a-section">
      <form id="addToCart" method="post" action="/gp/product/handle-buy-box/ref=dp_start-bbf_1_glance">
        <input type="hidden" name="items[0.base][customerVisiblePrice][amount]" value="52.13">
        <input type="hidden" name="items[0.base][customerVisiblePrice][currencyCode]" value="CAD">
        <input type="hidden" id="usedMerchantID" name="usedMerchantID" value="AUJBRIGYRJ3Q8">
        <div id="twisterPlusPriceSubtotalWWDesktop_feature_div"><input type="hidden" id="twister-plus-price-data-price" value="54.98"></div>
        <div id="availability_feature_div"><span class="primary-availability-message a-text-bold"> Only 3 left in stock. </span></div>
        <div id="addToCart_feature_div"><div class="a-button-stack"><span id="atc-declarative"><span class="a-button a-button-primary"><span class="a-button-inner"><input id="add-to-cart-button-ubb" name="submit.add-to-cart-ubb" class="a-button-input" type="submit" value="Add to cart"></span></span></span></div></div>
      </form>
    </div></div>
  </div></div>

</div></div></div></div>
