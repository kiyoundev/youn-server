<!-- Trimmed from real amazon.ca markup (B073S5JHRV, one new offer, plain layout), 2026-10-12.
     Tokens, session ids and postal code removed. The "other-sellers" block is synthetic:
     it stands in for the "Other sellers on Amazon" box, which sits outside the buy box. -->
<div id="apex_desktop">
  <div id="corePriceDisplay_desktop_feature_div">
    <div><div>
      <span class="a-price aok-align-center apex-pricetopay-value" data-a-size="xl" data-a-color="base"><span class="a-offscreen"></span><span aria-hidden="true"><span class="a-price-symbol">$</span><span class="a-price-whole">88<span class="a-price-decimal">.</span></span><span class="a-price-fraction">00</span></span></span>
      <span id="apex-pricetopay-accessibility-label" data-pricetopay-label="{priceToPay}" data-pricetopay-savings-label="{priceToPay} with {savings} percent savings" class="aok-offscreen">$88.00</span>
    </div></div>
  </div>
</div>
<div id="qualifiedBuybox">
  <form id="addToCart" method="post" action="/gp/product/handle-buy-box/ref=dp_start-bbf_1_glance">
    <input type="hidden" name="items[0.base][customerVisiblePrice][amount]" value="88.0">
    <input type="hidden" name="items[0.base][customerVisiblePrice][currencyCode]" value="CAD">
    <input type="hidden" name="items[0.base][customerVisiblePrice][displayString]" value="$88.00">
    <div class="a-section">
      <div id="apex_offerDisplay_desktop">
        <div id="corePrice_feature_div">
          <div class="a-section a-spacing-micro"><div class="a-section apex-core-price-identifier">
            <span class="a-price aok-align-center apex-pricetopay-value" data-a-size="xl" data-a-color="base"><span class="a-offscreen">$88.00</span><span aria-hidden="true"><span class="a-price-symbol">$</span><span class="a-price-whole">88<span class="a-price-decimal">.</span></span><span class="a-price-fraction">00</span></span></span>
          </div></div>
        </div>
      </div>
      <div id="desktop_qualifiedBuyBox">
        <div class="a-section a-spacing-none a-padding-none">
          <div id="deliveryBlockMessage"><span data-csa-c-delivery-price="FREE"> FREE delivery <span class="a-text-bold">Friday, October 16</span> </span></div>
          <div id="availability"><span class="primary-availability-message"> In Stock </span></div>
          <div id="twisterPlusPriceSubtotalWWDesktop_feature_div">
            <input type="hidden" id="twister-plus-price-data-price" value="88">
            <span id="tp_price_block_total_price_ww" class="a-price"><span class="a-offscreen">$88.00</span></span>
          </div>
          <div id="addToCart_feature_div">
            <div class="a-button-stack"><span id="atc-declarative"><span id="submit.add-to-cart" class="a-button a-button-primary"><span class="a-button-inner"><input id="add-to-cart-button" name="submit.add-to-cart" class="a-button-input" type="button" value="Add to cart"></span></span></span></div>
          </div>
        </div>
      </div>
    </div>
  </form>
</div>
<div class="other-sellers">
  <h2>Other sellers on Amazon</h2>
  <span>New (3) from <span class="a-price"><span class="a-offscreen">$12.34</span></span> &amp; FREE Shipping.</span>
</div>
