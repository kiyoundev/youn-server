<!-- Trimmed from real amazon.ca markup (B0GSS5TK8R, new sold out, used-only buy box), 2026-10-12.
     The title price block still shows a price (the USED one, in the label span), and the used box
     carries its own hidden amount — neither may be mistaken for a new price. -->
<div id="corePriceDisplay_desktop_feature_div">
  <div><div>
    <span class="a-price aok-align-center apex-pricetopay-value" data-a-size="xl"><span class="a-offscreen"></span></span>
    <span id="apex-pricetopay-accessibility-label" data-pricetopay-label="{priceToPay}" data-pricetopay-savings-label="{priceToPay} with {savings} percent savings" class="aok-offscreen">$637.19</span>
  </div></div>
</div>
<div id="usedOnlyBuybox" class="a-section a-spacing-medium">
  <div class="a-row a-spacing-medium"><div class="a-box"><div class="a-box-inner">
    <div class="a-section a-spacing-none a-padding-none">
      <div id="usedBuySection" class="rbbHeader dp-accordion-row">
        <div class="a-row a-grid-vertical-align a-grid-center"><div class="a-column a-span12 a-text-left">
          <span class="a-text-bold">Buy Used :</span>
          <span class="a-size-base a-color-price offer-price a-text-normal">$637.19</span>
        </div></div>
        <div class="a-row"><span class="a-size-base a-color-price offer-price a-text-normal"></span></div>
      </div>
      <div id="usedbuyBox" class="rbbContent dp-accordion-inner">
        <input type="hidden" id="usedMerchantID" name="usedMerchantID" value="AUJBRIGYRJ3Q8">
        <input type="hidden" name="items[0.base][customerVisiblePrice][amount]" value="637.19">
        <input type="hidden" name="items[0.base][customerVisiblePrice][currencyCode]" value="CAD">
        <div class="a-row"><strong> Used: Very Good </strong></div>
        <div class="a-row"> Sold by <a id="sellerProfileTriggerId" href="/b?node=8929975011">Warehouse Deals</a></div>
        <div id="availability"><span class="primary-availability-message a-text-bold"> Only 3 left in stock. </span></div>
        <div class="a-button-stack"><span id="atc-declarative"><span id="submit.add-to-cart-ubb" class="a-button a-button-primary"><span class="a-button-inner"><input id="add-to-cart-button-ubb" name="submit.add-to-cart-ubb" class="a-button-input" type="submit" value="Add to cart"></span></span></span></div>
      </div>
    </div>
  </div></div></div>
</div>
